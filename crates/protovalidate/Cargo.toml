[package]
name = "protovalidate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Protocol Buffer message validation for Rust"
license.workspace = true
publish.workspace = true

[dependencies]
protovalidate-deps = { workspace = true, optional = true }

buffa.workspace = true
buffa-descriptor.workspace = true
buffa-types.workspace = true
foldhash.workspace = true
iri-string.workspace = true
jiff.workspace = true
percent-encoding.workspace = true
regex.workspace = true

[features]
default = ["cel"]
# Custom CEL rules, evaluated by cel-cpp, which `protovalidate-deps` builds
# from source. The standard rules are implemented natively and never need
# it, so a schema without custom rules can drop the C++ toolchain by
# disabling this feature.
cel = ["dep:protovalidate-deps"]

[lints]
workspace = true
