[package]
name = "protovalidate-py"
version.workspace = true
edition.workspace = true
publish.workspace = true

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
protovalidate = { path = "crates/protovalidate", default-features = false }
protovalidate-deps = { path = "crates/protovalidate-deps" }

buffa = "0.9.2"
buffa-descriptor = { version = "0.9.2", features = ["reflect"] }
buffa-types = { version = "0.9.2", features = ["reflect"] }
cc = { version = "1.4.3", features = ["parallel"] }
foldhash = "0.1.5"
iri-string = "0.7.14"
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
percent-encoding = "2.3.2"
regex = "1.13.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[lib]
crate-type = ["cdylib"]
name = "protovalidate"

[dependencies]
protovalidate = { workspace = true, features = ["cel"] }
pyo3 = { version = "0.29.1", features = ["experimental-inspect"] }

[build-dependencies]
pyo3-build-config = { version = "0.29.1", features = ["resolve-config"] }

[lints]
workspace = true

[profile.release]
debug = 0
strip = true
lto = true
codegen-units = 1
