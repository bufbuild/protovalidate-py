// One message per rule, each with a single field `value` carrying the rule
// under test.

syntax = "proto3";

package tests.example.v1;

import "buf/validate/validate.proto";

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_INACTIVE = 2;
}

message Int32Gt {
  int32 value = 1 [(buf.validate.field).int32.gt = 0];
}

message Int32Const {
  int32 value = 1 [(buf.validate.field).int32.const = 5];
}

message Int32In {
  int32 value = 1 [(buf.validate.field).int32 = {
    in: [
      1,
      2,
      3
    ]
  }];
}

message Int32NotIn {
  int32 value = 1 [(buf.validate.field).int32 = {
    not_in: [7]
  }];
}

message Int32GtLt {
  int32 value = 1 [(buf.validate.field).int32 = {
    gt: 0
    lt: 10
  }];
}

message Uint64Gte {
  uint64 value = 1 [(buf.validate.field).uint64.gte = 10];
}

message DoubleLt {
  double value = 1 [(buf.validate.field).double.lt = 100];
}

message StringMinLen {
  string value = 1 [(buf.validate.field).string.min_len = 3];
}

message StringMinBytes {
  string value = 1 [(buf.validate.field).string.min_bytes = 5];
}

message StringPrefix {
  string value = 1 [(buf.validate.field).string.prefix = "hello"];
}

message StringSuffix {
  string value = 1 [(buf.validate.field).string.suffix = "bar"];
}

message StringContains {
  string value = 1 [(buf.validate.field).string.contains = "mid"];
}

message StringNotContains {
  string value = 1 [(buf.validate.field).string.not_contains = "bad"];
}

message StringConst {
  string value = 1 [(buf.validate.field).string.const = "a"];
}

message StringIn {
  string value = 1 [(buf.validate.field).string = {
    in: [
      "a",
      "b"
    ]
  }];
}

message StringNotIn {
  string value = 1 [(buf.validate.field).string = {
    not_in: ["z"]
  }];
}

message StringPattern {
  string value = 1 [(buf.validate.field).string.pattern = "^[a-z]+$"];
}

message StringEmail {
  string value = 1 [(buf.validate.field).string.email = true];
}

message StringUuid {
  string value = 1 [(buf.validate.field).string.uuid = true];
}

message StringHeaderName {
  string value = 1 [(buf.validate.field).string = {
    well_known_regex: KNOWN_REGEX_HTTP_HEADER_NAME
    strict: true
  }];
}

message BoolConst {
  bool value = 1 [(buf.validate.field).bool.const = true];
}

message BytesConst {
  bytes value = 1 [(buf.validate.field).bytes.const = "\x01"];
}

message BytesIn {
  bytes value = 1 [(buf.validate.field).bytes = {
    in: [
      "\x01",
      "\x02"
    ]
  }];
}

message BytesNotIn {
  bytes value = 1 [(buf.validate.field).bytes = {
    not_in: ["\x07"]
  }];
}

message BytesMinLen {
  bytes value = 1 [(buf.validate.field).bytes.min_len = 2];
}

message BytesPrefix {
  bytes value = 1 [(buf.validate.field).bytes.prefix = "\x0a"];
}

message BytesIp {
  bytes value = 1 [(buf.validate.field).bytes.ip = true];
}

message RepeatedMinItems {
  repeated int32 value = 1 [(buf.validate.field).repeated.min_items = 2];
}

message RepeatedMaxItems {
  repeated int32 value = 1 [(buf.validate.field).repeated.max_items = 2];
}

message RepeatedUnique {
  repeated int32 value = 1 [(buf.validate.field).repeated.unique = true];
}

message RepeatedUniqueItems {
  repeated int32 value = 1 [(buf.validate.field).repeated = {
    unique: true
    items: {
      int32: {gte: 2}
    }
  }];
}

message RepeatedUniqueMaxItems {
  repeated int32 value = 1 [(buf.validate.field).repeated = {
    unique: true
    max_items: 3
    items: {
      int32: {gte: 2}
    }
  }];
}

message MapMaxPairs {
  map<string, string> entries = 1 [(buf.validate.field).map.max_pairs = 2];
}

message EnumConst {
  Status value = 1 [(buf.validate.field).enum.const = 1];
}

message EnumIn {
  Status value = 1 [(buf.validate.field).enum = {
    in: [
      1,
      2
    ]
  }];
}

message EnumNotIn {
  Status value = 1 [(buf.validate.field).enum = {
    not_in: [0]
  }];
}

message EnumDefinedOnlyIn {
  Status value = 1 [(buf.validate.field).enum = {
    defined_only: true
    in: [
      1,
      2
    ]
  }];
}

message EnumDefinedOnlyConst {
  Status value = 1 [(buf.validate.field).enum = {
    defined_only: true
    const: 1
  }];
}

message EnumDefinedOnlyNotIn {
  Status value = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}
