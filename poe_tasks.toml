#:schema https://json.schemastore.org/partial-poe.json

[tasks.bench]
help = "Run benchmarks"
cmd = "pytest --benchmark-enable --benchmark-only --benchmark-autosave"

[tasks.bench-compare]
help = "Compare saved benchmark runs"
cmd = "pytest-benchmark compare --group-by=func,param:_id --sort=name"

[tasks.check]
help = "Run code checks"
sequence = [
  "lint",
  "test",
]

[tasks.diffcheck]
help = "Check for uncommitted or untracked files (guards against codegen regressions)"
shell = "test -z \"$(git status --porcelain | tee /dev/stderr)\""

[tasks.docs-build]
help = "Build documentation"
cmd = "uv run --group docs zensical build"

[tasks.docs-serve]
help = "Start documentation local server"
cmd = "uv run --group docs zensical serve"

[tasks.generate]
sequence = [
  "generate-cel",
  "generate-protovalidate",
  "generate-stub",
  "generate-test",
  "format-license-header",
  "format-protos",
]

[tasks.generate-cel]
script = "scripts.generate_cel:main"

[tasks.generate-protovalidate]
script = "scripts.generate_protovalidate:main"

[tasks.generate-stub]
help = "Generate the native extension's type stub from pyo3 introspection"
sequence = [
  # We use the release profile to prevent compile cache churn from executing
  # this and the standard build, but need to make sure to disable stripping
  # which is needed for generation. Since it's a link argument, it doesn't
  # affect compile caching.
  { cmd = "maturin generate-stubs --profile release --out protovalidate", env = { CARGO_PROFILE_RELEASE_STRIP = "none" } },
  "format-license-header",
  # Unsafe fixes are docstring rewrites (trailing whitespace, one-lining);
  # safe on a generated file whose docstrings come from Rust doc comments.
  { cmd = "ruff check --fix --unsafe-fixes protovalidate/_protovalidate.pyi" },
  { cmd = "ruff format protovalidate/_protovalidate.pyi" },
]

[tasks.generate-test]
sequence = [
  { script = "poethepoet.scripts:rm('test/gen/tests')" },
  { cmd = "buf generate", cwd = "test" },
  { cmd = "fix-protobuf-imports test/gen" },
]

[tasks.generate-vendored]
help = "Generate vendored sources for the native extension"
script = "scripts.extract_native_sources:main"

[tasks.format]
help = "Apply all possible auto-formatting to files"
sequence = [
  "format-python",
  "format-protos",
  "format-rust",
  "format-toml",
  "format-license-header",
]

[tasks.format-license-header]
help = "Add/update license headers in source files"
cmd = "license-header"

[tasks.format-protos]
help = "Apply auto-formatting to protobuf files"
sequence = [
  { cmd = "buf format --write" },
  { cmd = "buf format --write", cwd = "test" },
]

[tasks.format-python]
help = "Apply auto-formatting to Python files"
sequence = [
  { cmd = "ruff check --fix --unsafe-fixes --exit-zero" },
  { cmd = "ruff format" },
]

[tasks.format-rust]
help = "Format native extension code"
sequence = [
  { cmd = "cargo clippy --fix --allow-dirty" },
  { cmd = "cargo fmt" },
]

[tasks.format-toml]
help = "Apply formatting to TOML files"
cmd = "tombi format"

[tasks.lint]
help = "Apply all possible linting to files"
sequence = [
  "lint-python",
  "lint-protos",
  "lint-rust",
  "lint-toml",
  "lint-license-header",
  { cmd = "uv lock --check" },
]

[tasks.lint-license-header]
help = "Check license headers in source files"
cmd = "license-header --check"

[tasks.lint-protos]
help = "Apply linting to protobuf files"
sequence = [
  { cmd = "buf format -d --exit-code" },
  { cmd = "buf format -d --exit-code", cwd = "test" },
]

[tasks.lint-rust]
help = "Lint native extension code"
sequence = [
  { cmd = "cargo clippy" },
  { cmd = "cargo fmt --check" },
]

[tasks.lint-python]
help = "Apply linting to Python files"
sequence = [
  { cmd = "ruff check" },
  { cmd = "ruff format --check" },
  { cmd = "ty check protovalidate" },
]

[tasks.lint-toml]
help = "Apply linting to TOML files"
sequence = [
  { cmd = "tombi format --check" },
  { cmd = "tombi lint" },
]

[tasks.test]
help = "Run unit tests"
cmd = "pytest"
